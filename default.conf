[ids]
*

[main]
# 1. Remap Copilot Key to Right Control
leftmeta+leftshift+f23 = rightcontrol

# 2. Force both physical Alt keys to use the exact same layer
leftalt = layer(alt)
rightalt = layer(alt)

[alt]
# Alt + Left/Right -> Start/End of line
left = home
right = end

# Alt + Backspace -> Highlight to start of line and Delete
backspace = macro(S-home backspace)
